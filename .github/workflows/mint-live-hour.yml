name: Mint live hour

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/mint-queue.ts
        env:
          MINT_COUNT: '1'
      - name: Publish the queue
        run: |
          git config user.name "DeepSeekOracle"
          git config user.email "excavationpro@chatagent.ca"
          git add live/queue.json live/heard.json
          if git diff --cached --quiet; then
            echo "No new hour."
          else
            git commit -m "Mint the next live hour from public feeds."
            git push
          fi
